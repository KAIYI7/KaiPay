server.address=127.0.0.1
server.port=28082
server.forward-headers-strategy=NONE
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.accesslog.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.mvc.log-request-details=false
spring.web.resources.add-mappings=false
spring.main.banner-mode=off
logging.level.root=WARN
bridge.enabled=${BRIDGE_ENABLED:false}
bridge.device-token=${BRIDGE_DEVICE_TOKEN:}
bridge.receiver-token=${BRIDGE_RECEIVER_TOKEN:}
bridge.live-device-token=${BRIDGE_LIVE_DEVICE_TOKEN:}
bridge.live-device-id=${BRIDGE_LIVE_DEVICE_ID:}
bridge.store=${BRIDGE_STORE:.local/observations.json}
