# =============================================================================
# KaiPay Application Configuration
# Dedicated Port Allocation (Isolated from Payd & Host Services):
#   - KaiPay API Server: 28080
#   - KaiPay PostgreSQL: 25432 (mapped to container 5432)
#   - KaiPay Apache Kafka: 29092 (mapped to container 9092)
#   - KaiPay Redis: 26379 (mapped to container 6379)
#   - KaiPay Kafka-UI: 28048 (mapped to container 8080)
# =============================================================================

server:
  port: ${PORT:28080}
  # Trust no proxy headers until a specific ingress boundary is reviewed.
  forward-headers-strategy: none
  tomcat:
    # Only form parameter parsing; financial API JSON bodies are unchanged.
    max-http-form-post-size: 8KB
  servlet:
    session:
      timeout: ${SESSION_IDLE_TIMEOUT:20m}
      persistent: false
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: strict

spring:
  application:
    name: KaiPay
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        delivery.timeout.ms: 3000
        request.timeout.ms: 2000
    consumer:
      group-id: kaipay-payment-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

kaipay:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  kafka:
    topics:
      payment-requests: kaipay.payment.requests
  outbox:
    batch-size: 20
    poll-interval-ms: 500
    retry-initial-delay-ms: 1000
    retry-max-delay-ms: 60000
    send-timeout-ms: 4000

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.lky.kaipay: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    # These framework loggers emit raw records, SQL row details or exception chains.
    # Application failure categories/SQLSTATE + correlation remain available instead.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.springframework.kafka.support.LoggingProducerListener: OFF
    org.springframework.kafka.listener.DefaultErrorHandler: OFF
    org.springframework.kafka.listener.KafkaMessageListenerContainer: OFF
    org.springframework.kafka.listener.DeadLetterPublishingRecoverer: OFF
    org.springframework.kafka.retrytopic.DeadLetterPublishingRecovererFactory: OFF
